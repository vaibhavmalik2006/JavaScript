<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .blue_button {
        height: 50px;
        width: 50px;
        background-color: rgb(0, 37, 117);
        border: 4px solid black;

    }
    .red_button {
        height: 50px;
        width: 50px;
        background-color: rgb(117, 0, 6);
        border: 4px solid black;
    }
    .white_button {
        height: 50px;
        width: 50px;
        border: 4px solid black;
        background-color: rgb(240, 240, 240);
    }
    .black_button {
        height: 50px;
        width: 50px;
        background-color: rgb(3, 5, 8);
        border: 4px solid black;
    }
    .canvas1{
        display: flex;
        padding: 12px;
        margin-left: 25px;
        gap: 20px;
    }
    .h1{
        display: flex;
        justify-content: center;
    }
    .canvas{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 50vh;
        gap: 10px;
    }

</style>

<body>
    <div class="canvas">
        <h1 class="h1">change color of background</h1>
        <div class="canvas1">
        <div class="blue_button"><span class="button" id="blue"></span></div>
        <div class="red_button"><span class="button" id="red"></span></div>
        <div class="white_button"><span class="button" id="white"></span></div>
       <div class="black_button"><span class="button" id="black"></span></div>
       </div>

    </div>


</body>
<script src="index.js"></script>

</html>
